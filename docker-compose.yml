version: '3.8'

services:
  backend:
    build: ./backend
    container_name: wework-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/prod.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - create a .env file next to docker-compose.yml with JWT_SECRET=...}
      FRONTEND_URL: ${FRONTEND_URL:-https://erp.weworkconstruction.in}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      PORT: 4001
      NODE_ENV: production
    # push schema (--accept-data-loss so a destructive column change, e.g. a
    # dropped field, doesn't crash-loop the container on startup), seed once
    # (|| true so re-runs don't crash on existing data), then start
    command: sh -c "npx prisma db push --accept-data-loss && (npm run seed || true) && node dist/index.js"
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/uploads
    networks:
      - wework-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: wework-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - wework-net

volumes:
  sqlite_data:
  uploads_data:

networks:
  wework-net:
    driver: bridge
